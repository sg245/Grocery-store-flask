<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #28a745, #43d17a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            border-radius: 20px;
            padding: 30px;
            background: white;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
    </style>
</head>

<body>

<div class="login-card">

    <h3 class="text-center fw-bold mb-4">🔐 User Login</h3>

    <form method="POST" action="/login">

        <div class="mb-3">
            <input type="email"
                   name="email"
                   class="form-control rounded-pill"
                   placeholder="Email"
                   required>
        </div>

        <div class="mb-3">
            <input type="password"
                   name="password"
                   class="form-control rounded-pill"
                   placeholder="Password"
                   required>
        </div>

        <button type="submit"
                class="btn btn-success w-100 rounded-pill">
            Login
        </button>

    </form>

    <hr class="my-4">

    <!-- ADMIN LOGIN -->
    <div class="text-center">
        <p class="text-muted mb-2">Are you an admin?</p>

        <a href="/admin" class="btn btn-outline-dark rounded-pill w-100">
            🛠️ Login as Admin
        </a>
    </div>

</div>

</body>
</html>
